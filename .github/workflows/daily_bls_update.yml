name: Scheduled BLS Data Update

on:
  schedule:
    - cron: '05 14 * * *'
    - cron: '35 12 * * 5'
  workflow_dispatch:

jobs:
  run-bls-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install R package dependencies
        run: |
          Rscript -e 'install.packages(c("pacman", "httr", "jsonlite", "dplyr", "purrr", "DBI", "RSQLite", "tibble", "tidyr"))'

      - name: Run BLS script
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: |
          Rscript bls_dash_data.R

      - name: Commit and push updated CSV to Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add run/bls_tableau_master.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated BLS data refresh [skip ci]" && git pull --rebase origin main && git push)
